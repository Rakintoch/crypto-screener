name: Telegram Bot Listener

on:
  schedule:
    # Verifica a cada 5 minutos se enviaste um comando (ex: /status) ao bot, e reavalia as
    # posições já abertas do desafio de portfólio (take-profit/trailing stop/stop-loss),
    # sem repetir a descoberta cara de tokens novos — isso continua a cargo do screener
    # principal (screener.yml, a cada 2h).
    # (reativação do agendamento em repositórios novos — GitHub por vezes exige um novo
    # commit ao ficheiro para começar a respeitar o "schedule"; nova tentativa 2026-08-28
    # depois de desativar/reativar as Actions em Settings, para forçar o GitHub a
    # reconhecer o "schedule" novamente num repositório privado recente; nova tentativa
    # 2026-08-30 depois de detetado um novo hiato de ~3h sem corridas agendadas; encurtado
    # de 15 para 5 minutos a 2026-08-31 a pedido do Ricardo, dado que as moedas seguidas são
    # voláteis e os preços mudam em janelas curtas — 5 min é o intervalo mínimo prático que o
    # GitHub Actions suporta para "schedule"; triplica o número de corridas/dia, o que também
    # pode tornar mais visível (não pior) o hiato ocasional de agendamento já documentado acima)
    # Autoanálise 2026-09-13: novo hiato detetado nas corridas REAIS (histórico do separador
    # Actions) — apesar do cron correto (*/5 min), execuções sucessivas ficaram ~4h49m e
    # ~4h49m apartadas (01:58 -> 06:50 -> 11:39 UTC+1) em vez de a cada poucos minutos. Isto
    # apanhou uma posição (LSK) a subir e a recuar de novo TODA dentro de um único hiato —
    # o trailing stop nunca chegou a ver o pico real para poder reagir a ele. Nudge de
    # reativação (mesma técnica de 2026-08-28/08-30/08-31) para forçar o GitHub a voltar a
    # respeitar o agendamento; se recorrer, precisa de um disparo externo (ex.: webhook
    # repository_dispatch a partir de um cron-job.org gratuito) em vez de confiar só no
    # "schedule" nativo.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Partilha o MESMO grupo do screener.yml de propósito: as duas workflows escrevem no mesmo
# data/portfolio_state.json, e correrem ao mesmo tempo é exatamente o que causou o incidente
# de 2026-08-31 (um "git pull --rebase --autostash" em conflito deixou marcadores de conflito
# commitados no ficheiro, o que reiniciou o desafio sem ninguém pedir). Antes disto, este
# grupo só evitava duas execuções DESTA workflow em simultâneo — não protegia contra o
# screener.yml, que é a outra metade do problema.
concurrency:
  group: crypto-screener-git-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verificar comandos do Telegram (ex: /status)"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m screener.telegram_bot

      - name: Reavaliar posições abertas (take-profit/trailing stop/stop-loss)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTFOLIO_ENABLED: ${{ vars.PORTFOLIO_ENABLED || 'true' }}
        run: python -m screener.position_monitor

      - name: Guardar estado (offset do bot + portfólio + lições + vitórias) de volta no repositório
        run: |
          git config user.name "crypto-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git pull --rebase --autostash; then
            echo "::error::git pull --rebase falhou (conflito) — a abortar sem commitar para não corromper o estado"
            git rebase --abort || true
            git stash drop || true
            exit 1
          fi
          git add data/bot_offset.json data/portfolio_state.json data/pump_watch_state.json data/lessons.json data/wins.json data/changelog.json
          git diff --quiet --cached || git commit -m "chore: atualizar offset do bot + portfólio [skip ci]"
          git push
