name: Telegram Bot Listener

on:
  schedule:
    # Verifica a cada 15 minutos se enviaste um comando (ex: /status) ao bot, e reavalia as
    # posições já abertas do desafio de portfólio (take-profit/trailing stop/stop-loss),
    # sem repetir a descoberta cara de tokens novos — isso continua a cargo do screener
    # principal (screener.yml, a cada 2h).
    # (reativação do agendamento em repositórios novos — GitHub por vezes exige um novo
    # commit ao ficheiro para começar a respeitar o "schedule"; nova tentativa 2026-08-28
    # depois de desativar/reativar as Actions em Settings, para forçar o GitHub a
    # reconhecer o "schedule" novamente num repositório privado recente)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Evita que duas execuções corram ao mesmo tempo e entrem em conflito a escrever no
# portfolio_state.json — importante agora que uma corrida pode demorar alguns minutos extra
# quando o trailing stop está a vigiar uma posição que acabou de atingir o alvo.
concurrency:
  group: telegram-bot-listener
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: "Verificar comandos do Telegram (ex: /status)"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m screener.telegram_bot

      - name: Reavaliar posições abertas (take-profit/trailing stop/stop-loss)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTFOLIO_ENABLED: ${{ vars.PORTFOLIO_ENABLED || 'true' }}
        run: python -m screener.position_monitor

      - name: Guardar estado (offset do bot + portfólio) de volta no repositório
        run: |
          git config user.name "crypto-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/bot_offset.json data/portfolio_state.json
          git diff --quiet --cached || git commit -m "chore: atualizar offset do bot + portfólio [skip ci]"
          git push
