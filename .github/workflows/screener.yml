name: Crypto Screener

on:
  schedule:
    # Corre a cada 2 horas. Ajusta o cron abaixo se quiseres outra frequência.
    # (reativação do agendamento em repositórios novos — GitHub por vezes exige um novo
    # commit ao ficheiro para começar a respeitar o "schedule"; nova tentativa 2026-08-28
    # depois de desativar/reativar as Actions em Settings, para forçar o GitHub a
    # reconhecer o "schedule" novamente num repositório privado recente; nova tentativa
    # 2026-08-30 depois de detetado um novo hiato de ~3h sem corridas agendadas)
    # Autoanálise 2026-09-13: novo hiato detetado nas corridas REAIS deste workflow também
    # (v. bot_listener.yml para o detalhe) — corridas do Crypto Screener espaçadas ~4-5h em
    # vez de a cada 2h. Nudge de reativação igual ao aplicado no bot_listener.yml.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # permite correr manualmente a partir do separador "Actions" no GitHub

# Partilha o MESMO grupo do bot_listener.yml de propósito: as duas workflows escrevem no
# mesmo data/portfolio_state.json, e correrem ao mesmo tempo é exatamente o que causou o
# incidente de 2026-08-31 (um "git pull --rebase --autostash" em conflito deixou marcadores
# de conflito commitados no ficheiro, o que reiniciou o desafio sem ninguém pedir). Com o
# mesmo grupo, o GitHub Actions garante que nunca há duas execuções (desta ou da outra
# workflow) a escrever no repositório ao mesmo tempo.
concurrency:
  group: crypto-screener-git-state
  cancel-in-progress: false

permissions:
  contents: write   # necessário para o workflow poder commitar o data/state.json actualizado

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Correr o screener + desafio de portfólio virtual
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Põe a "false" nos Repository Variables (não secrets) se quiseres desligar
          # temporariamente o desafio de portfólio sem tocar no código.
          PORTFOLIO_ENABLED: ${{ vars.PORTFOLIO_ENABLED || 'true' }}
        run: python -m screener.main

      - name: Guardar estado (anti-spam + portfólio virtual + lições + vitórias) de volta no repositório
        run: |
          git config user.name "crypto-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git pull --rebase --autostash; then
            echo "::error::git pull --rebase falhou (conflito) — a abortar sem commitar para não corromper o estado"
            git rebase --abort || true
            git stash drop || true
            exit 1
          fi
          # Salvaguarda (incidente 2026-09-20, repetição do de 2026-08-31 apesar do "concurrency"
          # acima): "git pull --rebase --autostash" pode devolver sucesso mesmo quando o
          # reaplicar do autostash (stash pop) fica em conflito — nesse caso o Git deixa
          # marcadores de conflito ("<<<<<<< Updated upstream" / "=======" / ">>>>>>> Stashed
          # changes") escritos nos ficheiros, e sem esta verificação eram commitados tal e qual,
          # corrompendo o estado partilhado. Quando isto acontece, esta corrida local perdeu a
          # corrida contra outra execução que entretanto já publicou — em vez de tentar um merge
          # automático de JSON linha-a-linha (não é seguro para estas estruturas), descarta-se o
          # recálculo local desta corrida a favor do estado remoto já publicado (HEAD após o
          # rebase); esta corrida simplesmente não grava nada de novo, e a próxima (dentro de
          # minutos) recalcula com a base já correta.
          UNMERGED=$(git diff --name-only --diff-filter=U)
          if [ -n "$UNMERGED" ]; then
            echo "::warning::conflito ao reaplicar o autostash em: $UNMERGED — a descartar o recálculo local desta corrida e a manter o estado remoto já publicado"
            git checkout --ours -- $UNMERGED
            git add $UNMERGED
            git stash drop || true
          fi
          # Segunda rede de segurança: garante que nenhum marcador de conflito sobrevive nos
          # ficheiros de dados por qualquer outra via antes de committar.
          if grep -rl '^<<<<<<< ' data/*.json 2>/dev/null; then
            echo "::error::marcadores de conflito ainda presentes nos ficheiros de dados após a resolução — a abortar sem commitar"
            exit 1
          fi
          git add data/state.json data/portfolio_state.json data/pump_watch_state.json data/lessons.json data/wins.json data/changelog.json
          git diff --quiet --cached || git commit -m "chore: atualizar estado do screener [skip ci]"
          git push
